# STXXL disk configuration used by experiments/run_all.sh (copied as .stxxl into each run directory).
# One file of up to 60 GiB in /var/tmp/stxxl, plain syscalls, O_DIRECT, queue depth 32, deleted when opened.
# Change the path/size for your machine; keep direct=on so that STXXL I/O bypasses the page cache.
disk=/var/tmp/stxxl,60Gi,syscall unlink queue=32 direct=on
